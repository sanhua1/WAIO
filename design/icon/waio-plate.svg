<?xml version="1.0" encoding="UTF-8"?>
<!--
  WAIO 程序图标(选定方向:带底板 + 实心四色 Win 键符号)。
  构图借鉴 MAIO:浅色底板上一叠斜向错开的彩色卡片 + 最前面白卡片上的按键符号。
  这里是微软四色卡片,白卡片上的 Win 符号四格也是四色(左上红、右上绿、左下蓝、右下黄)。
  坐标、尺寸为本项目自绘,未复制 MAIO 素材。画布 1024;卡片 600、圆角 136、每层错开 64。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F8FA"/>
      <stop offset="1" stop-color="#D6DAE3"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0F4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect width="1024" height="1024" rx="224" fill="url(#plate)"/>

  <!-- 卡片,从后往前:绿、黄、红、蓝 -->
  <rect x="340" y="84"  width="600" height="600" rx="136" fill="#7FBA00" filter="url(#shadow)"/>
  <rect x="276" y="148" width="600" height="600" rx="136" fill="#FFB900" filter="url(#shadow)"/>
  <rect x="212" y="212" width="600" height="600" rx="136" fill="#F25022" filter="url(#shadow)"/>
  <rect x="148" y="276" width="600" height="600" rx="136" fill="#00A4EF" filter="url(#shadow)"/>

  <!-- 最前面的白卡片 -->
  <rect x="84" y="340" width="600" height="600" rx="136" fill="url(#paper)" stroke="#000" stroke-opacity="0.06" stroke-width="4" filter="url(#shadow)"/>

  <!-- Win 键符号:实心四色 -->
  <rect x="212" y="468" width="160" height="160" rx="20" fill="#F25022"/>
  <rect x="396" y="468" width="160" height="160" rx="20" fill="#7FBA00"/>
  <rect x="212" y="652" width="160" height="160" rx="20" fill="#00A4EF"/>
  <rect x="396" y="652" width="160" height="160" rx="20" fill="#FFB900"/>
</svg>

